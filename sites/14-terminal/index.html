<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blixt@umeå:~ – Blixt Bröllopsfoto, Umeå</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050805;--fg:#39ff6a;--dim:#1c8a3a;--amber:#ffb000;--err:#ff5555;--win:#0b120c}
body.amber{--fg:#ffb000;--dim:#8a5f00;--amber:#39ff6a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:'IBM Plex Mono',monospace;font-size:15px;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(rgba(0,0,0,.25) 0 1px,transparent 1px 3px)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:41;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.6))}
a{color:var(--amber)}
.top{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;padding:8px 16px;background:var(--fg);color:var(--bg);font-weight:600;font-size:13px}
.top a,.top button{color:var(--bg);background:none;border:none;font:inherit;cursor:pointer;text-decoration:none}
.top a:hover,.top button:hover{text-decoration:underline}
.top .sp{flex:1}
.top .lbl{opacity:.7}
#term{max-width:1100px;margin:0 auto;padding:20px 16px 140px;text-shadow:0 0 6px currentColor}
pre{font-family:inherit;white-space:pre;overflow-x:auto;max-width:100%}
.ascii{color:var(--fg);font-size:clamp(5px,1.35vw,14px);line-height:1.1}
.line{white-space:pre-wrap;word-break:break-word}
.dim{color:var(--dim)}.am{color:var(--amber)}.er{color:var(--err)}
.prompt{color:var(--amber)}
.inrow{display:flex;gap:8px;align-items:center}
#cmd{flex:1;min-width:0;background:transparent;border:none;color:var(--fg);font:inherit;caret-color:var(--fg);text-shadow:inherit;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chips button{background:transparent;border:1px solid var(--dim);color:var(--fg);font:inherit;padding:2px 10px;cursor:pointer}
.chips button:hover{background:var(--fg);color:var(--bg)}
.win{border:2px solid var(--fg);background:var(--win);margin:14px 0;text-shadow:none;max-width:100%}
.win .bar{display:flex;justify-content:space-between;background:var(--fg);color:var(--bg);padding:2px 8px;font-weight:600;font-size:13px}
.win .bar span:last-child{letter-spacing:4px}
.win .body{padding:8px}
.win img,.win video{display:block;width:100%;height:100%;object-fit:cover;filter:grayscale(1) sepia(1) hue-rotate(70deg) saturate(2.2) contrast(1.1) brightness(.9);transition:filter .4s}
body.amber .win img,body.amber .win video{filter:grayscale(1) sepia(1) saturate(2.5) contrast(1.1) brightness(.9)}
.win:hover img,.win:hover video,.win.color img,.win.color video{filter:none}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.wgrid .win{margin:0;cursor:zoom-in}
.wgrid{align-items:start}.wgrid .body{padding:4px}.wgrid .body img{aspect-ratio:4/3;height:auto}
.wgrid .win.p .body img{aspect-ratio:3/4}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
table{border-collapse:collapse;margin:8px 0;width:100%;max-width:760px}
td,th{border:1px solid var(--dim);padding:6px 10px;text-align:left;vertical-align:top}
th{color:var(--amber)}
form.bk{display:grid;gap:8px;max-width:560px;margin:10px 0}
form.bk label{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center}
form.bk input,form.bk textarea{background:transparent;border:1px dashed var(--dim);color:var(--fg);font:inherit;padding:4px 8px;width:100%}
form.bk button{justify-self:start;background:var(--fg);color:var(--bg);border:none;font:inherit;font-weight:600;padding:4px 14px;cursor:pointer}
.big{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:none;place-items:center;padding:20px}
.big.on{display:grid}
.big .win{max-width:min(1000px,94vw)}
.big img{max-height:80vh;filter:none!important}
.back{position:fixed;right:10px;bottom:10px;z-index:45;font-family:'VT323';font-size:20px;color:var(--bg);background:var(--fg);padding:0 10px;text-decoration:none}
.blink{animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
@media (max-width:600px){body{font-size:13px}form.bk label{grid-template-columns:1fr}.top{font-size:12px}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
</style>
</head>
<body>
<nav class="top" aria-label="Enkel meny">
 <span>BLIXT/OS 2.6</span>
 <span class="lbl">Ingen nörd? Klicka här:</span>
 <button data-run="cat om.txt">Om</button>
 <button data-run="view gallery">Galleri</button>
 <button data-run="priser">Priser</button>
 <button data-run="boka">Boka</button>
 <span class="sp"></span>
 <button id="theme" title="Byt färg">[grön/bärnsten]</button>
</nav>
<main id="term" aria-live="polite">
 <div id="out"></div>
 <div class="inrow"><label for="cmd" class="prompt">gäst@blixt:~$</label><input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Skriv ett kommando"></div>
 <div class="chips" id="chips" aria-label="Förslag"></div>
</main>
<a class="back" href="../../index.html">← Alla 25</a>
<div class="big" id="big"><div class="win"><div class="bar"><span id="bigt">bild.jpg</span><span>[x]</span></div><div class="body"><img alt="" id="bigi"></div></div></div>

<script>
const out=document.getElementById('out'),cmd=document.getElementById('cmd');
const I='../../media/img/';
const LOGO=String.raw`
 ____  _     _____  _______    _____ ____ _______ ____
|  _ \| |   |_ _\ \/ /_   _|  |  ___/ _ \_   _/ _ \
| |_) | |    | | \  /  | |    | |_ | | | || || | | |
|  _ <| |___ | | /  \  | |    |  _|| |_| || || |_| |
|_| \_\_____|___/_/\_\ |_|    |_|   \___/ |_| \___/
`;
const HEART=String.raw`
   .-"""-. .-"""-.
  /       '       \     Två kameror. Ett ja.
  \               /     Umeå & hela Västerbotten
   '.           .'
     '.       .'
       '.   .'
         '.'`;
const gallery=[
 ['brollop-13.jpg','vigsel_ume_alv.jpg','Brudpar vid älven'],['brollop-38.jpg','kyss_i_skogen.jpg','Kyss i skogen'],
 ['brollop-19.jpg','brud_portratt.jpg','Brudporträtt','p'],['brollop-39.jpg','langbord.jpg','Långbord utomhus'],
 ['brollop-52.jpg','buketten.jpg','Brudbukett','p'],['brollop-53.jpg','dansgolvet.jpg','Dansgolvet'],
 ['brollop-55.jpg','slojan.jpg','Brud med slöja','p'],['brollop-29.jpg','forsta_dansen.jpg','Första dansen'],
 ['brollop-45.jpg','kyrktrappan.jpg','Kyrktrappan'],['brollop-16.jpg','brudgummen.jpg','Brudgummen','p'],
 ['brollop-20.jpg','middagen.jpg','Middagen'],['brollop-43.jpg','bilen.jpg','Avfärd i bil'],
 ['brollop-54.jpg','skal.jpg','Skål'],['brollop-28.jpg','trappan.jpg','Brudpar i trappa','p'],
 ['brollop-56.jpg','gaster.jpg','Gäster'],['brollop-27.jpg','utgang.jpg','Utgång från kyrkan'],
 ['brollop-44.jpg','solnedgang.jpg','Solnedgång'],['brollop-49.jpg','vinden.jpg','Brud i vinden','p']];
const FILES={'om.txt':1,'priser.csv':1,'galleri/':1,'video.mp4':1,'aven.txt':1,'omdomen.log':1,'kontakt.txt':1};
function win(title,inner,cls=''){return `<div class="win ${cls}"><div class="bar"><span>${title}</span><span>_□x</span></div><div class="body">${inner}</div></div>`}
function print(html,cls='line'){const d=document.createElement('div');d.className=cls;d.innerHTML=html;out.appendChild(d);return d}
const C={
 help:()=>print(`Tillgängliga kommandon:
  <span class="am">help</span>          visa den här listan
  <span class="am">ls</span>            lista filer
  <span class="am">cat om.txt</span>    vilka är vi?
  <span class="am">view gallery</span>  öppna bildgalleriet
  <span class="am">play video.mp4</span> spela filmklipp
  <span class="am">priser</span>        paket och priser
  <span class="am">cat aven.txt</span>  porträtt, familj, företag
  <span class="am">cat omdomen.log</span> vad brudparen sagt
  <span class="am">boka</span>          skicka en förfrågan
  <span class="am">color</span>         växla grön/bärnsten
  <span class="am">clear</span>         rensa skärmen`),
 ls:()=>print(`<span class="dim">drwxr-xr-x</span>  galleri/      <span class="dim">-rw-r--r--</span>  om.txt
<span class="dim">-rw-r--r--</span>  priser.csv    <span class="dim">-rw-r--r--</span>  aven.txt
<span class="dim">-rw-r--r--</span>  omdomen.log   <span class="dim">-rw-r--r--</span>  kontakt.txt
<span class="dim">-rwxr-xr-x</span>  video.mp4`),
 'cat om.txt':()=>{print(`<pre class="dim">${HEART}</pre>`,'');print(`<div class="duo">${win('ida.jpg',`<img src="${I}portratt-09.jpg" alt="Fotografen Ida Blixt" style="aspect-ratio:4/3">`)}${win('anton.jpg',`<img src="${I}portratt-34.jpg" alt="Fotografen Anton Blixt" style="aspect-ratio:4/3;object-position:50% 25%">`)}</div>`,'');
  print(`# om.txt
Vi är Ida och Anton Blixt. Hon är systemutvecklare, han var
fjällguide. Vi började fota våra kompisars bröllop för att ingen
annan fick till ljuset i norrländska juninätter – det där som
aldrig riktigt blir mörkt.

Nu har vi fotat 180+ bröllop, från Umeå stadshus till
fjällstugor i Hemavan. Vi är lugna, nördiga och bra på att
få folk att glömma kameran. Leveranstid: 3 veckor. Alltid.

$ <span class="am">tips:</span> skriv "view gallery"`)},
 'view gallery':()=>{print(`Laddar ${gallery.length} bilder från ./galleri/ ... <span class="am">OK</span>`);
  const g=print(`<div class="wgrid">${gallery.map(([f,n,a,p])=>win(n,`<img src="${I}${f}" alt="${a}" loading="lazy">`,p?'p':'')).join('')}</div>`,'');
  g.querySelectorAll('.win').forEach(w=>w.onclick=()=>openBig(w.querySelector('img'),w.querySelector('.bar span').textContent));
  print(`<span class="dim">hovra/klicka för färg och större bild.</span>`)},
 'play video.mp4':()=>print(win('video.mp4 — mpv',`<video src="../../media/hero.mp4" autoplay muted loop playsinline controls style="aspect-ratio:16/9"></video>`,'color'),''),
 priser:()=>print(`# priser.csv
<table><tr><th>paket</th><th>tid</th><th>ingår</th><th>pris</th></tr>
<tr><td>blixt.lite</td><td>3 h</td><td>vigsel + porträtt, 150 bilder</td><td class="am">11 900 kr</td></tr>
<tr><td>blixt.std</td><td>7 h</td><td>förberedelser → tårta, 450 bilder, 2 fotografer</td><td class="am">22 400 kr</td></tr>
<tr><td>blixt.pro</td><td>∞</td><td>hela dagen + film + förlovningsfoto + album</td><td class="am">31 500 kr</td></tr>
<tr><td>--fjall</td><td></td><td>tillägg: resa till fjällen, inkl. övernattning</td><td class="am">+4 000 kr</td></tr></table>
<span class="dim">alla priser inkl. moms. resor inom 10 mil från Umeå ingår.</span>`),
 'cat aven.txt':()=>{print(`# aven.txt — vi fotar också porträtt, familjer och företag:`);
  const g=print(`<div class="wgrid">${[['familj-13.jpg','familj.jpg','Familjeporträtt','p'],['foretag-02.jpg','kontor.jpg','Företagsporträtt'],['foretag-27.jpg','konferens.jpg','Konferens'],['foretag-52.jpg','produkt.jpg','Företagsevent']].map(([f,n,a,p])=>win(n,`<img src="${I}${f}" alt="${a}" loading="lazy">`,p?'p':'')).join('')}</div>`,'');
  g.querySelectorAll('.win').forEach(w=>w.onclick=()=>openBig(w.querySelector('img'),w.querySelector('.bar span').textContent))},
 'cat omdomen.log':()=>print(`[2026-06-21 23:58] <span class="am">Linnea &amp; Mattias</span>: "Midnattssol, mygg och perfekta bilder. Tack!"
[2025-08-09 17:12] <span class="am">Farah &amp; Jonas</span>: "Anton fick min pappa att skratta på en bild. Det har aldrig hänt förut."
[2025-02-14 12:00] <span class="am">Elsa &amp; Vilma</span>: "Vinterbröllop i -24 grader. Kamerorna klarade det. Vi också, typ."
<span class="dim">3 poster. 0 klagomål.</span>`),
 'cat kontakt.txt':()=>print(`mail:   hej@blixtfoto.se
tel:    090-14 22 80
adress: Storgatan 50, 903 26 Umeå
eller kör: <span class="am">boka</span>`),
 boka:()=>{const f=print(`# boka — fyll i och tryck enter
<form class="bk"><label>namn:<input required name="n"></label><label>e-post:<input type="email" required name="e"></label><label>datum:<input type="date" name="d"></label><label>plats:<input name="p"></label><label>meddelande:<textarea rows="3" name="m"></textarea></label><button>./skicka.sh</button></form>`,'');
  const fm=f.querySelector('form');fm.querySelector('input').focus();
  fm.onsubmit=e=>{e.preventDefault();print(`skickar förfrågan... <span class="am">[200 OK]</span>\nTack ${fm.n.value.replace(/[<>&]/g,'')}! Vi svarar inom 24 h.`);fm.reset();scrollEnd()}},
 color:()=>{document.body.classList.toggle('amber');print('färgschema bytt.')},
 clear:()=>{out.innerHTML=''},
 whoami:()=>print('gäst – snart kanske brudpar?'),
 sudo:()=>print('<span class="er">Nice try.</span> Men vi gifter oss inte med er. Vi fotar bara.'),
};
C['cat priser.csv']=C.priser;C['cd galleri']=C['ls galleri']=C['view galleri']=C['ls galleri/']=C['view gallery'];C['play video']=C['play video.mp4'];C['om']=C['cat om.txt'];
const hist=[];let hi=0;
function run(raw){const c=raw.trim().replace(/\s+/g,' ');print(`<span class="prompt">gäst@blixt:~$</span> ${c.replace(/[<>&]/g,'')}`);
 if(!c){}else if(C[c.toLowerCase()])C[c.toLowerCase()]();else if(/^sudo/.test(c))C.sudo();
 else if(/^cat /.test(c))print(`<span class="er">cat: ${c.slice(4).replace(/[<>&]/g,'')}: Filen finns inte</span>. Prova "ls".`);
 else print(`<span class="er">${c.split(' ')[0].replace(/[<>&]/g,'')}: kommandot hittades inte</span>. Skriv <span class="am">help</span>.`);
 if(c){hist.push(c);hi=hist.length}scrollEnd()}
function scrollEnd(){requestAnimationFrame(()=>cmd.scrollIntoView({block:'end',behavior:'auto'}))}
function openBig(img,t){document.getElementById('bigi').src=img.src;document.getElementById('bigi').alt=img.alt;document.getElementById('bigt').textContent=t;document.getElementById('big').classList.add('on')}
document.getElementById('big').onclick=()=>document.getElementById('big').classList.remove('on');
cmd.addEventListener('keydown',e=>{if(e.key==='Enter'){run(cmd.value);cmd.value=''}
 else if(e.key==='ArrowUp'){if(hi>0){hi--;cmd.value=hist[hi]}e.preventDefault()}
 else if(e.key==='ArrowDown'){if(hi<hist.length-1){hi++;cmd.value=hist[hi]}else{hi=hist.length;cmd.value=''}e.preventDefault()}
 else if(e.key==='Tab'){e.preventDefault();const m=Object.keys(C).find(k=>k.startsWith(cmd.value)&&cmd.value);if(m)cmd.value=m}
 else if(e.key==='Escape')document.getElementById('big').classList.remove('on')});
document.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>run(b.dataset.run));
document.getElementById('theme').onclick=()=>document.body.classList.toggle('amber');
const chips=document.getElementById('chips');
['help','ls','cat om.txt','view gallery','play video.mp4','priser','cat aven.txt','cat omdomen.log','boka'].forEach(c=>{const b=document.createElement('button');b.textContent=c;b.onclick=()=>run(c);chips.appendChild(b)});
document.getElementById('term').addEventListener('click',e=>{if(e.target===e.currentTarget||e.target.id==='out')cmd.focus({preventScroll:true})});
// boot
print(`<pre class="ascii">${LOGO}</pre>`,'');
print(`<span class="dim">BLIXT/OS 2.6 (tty1) — bröllopsfotografi, Umeå
Senaste inloggning: lör 21 jun 23:58 från midnattssolen</span>

Välkommen! Det här är vår hemsida, fast som en terminal.
Skriv <span class="am">help</span> och tryck enter – eller klicka på knapparna nedan.`);
C['play video.mp4']();
</script>
</body>
</html>
